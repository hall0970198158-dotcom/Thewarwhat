# Render แบบเสียเงิน (Starter + Disk) — ไม่หลับ ข้อมูลเก็บเป็นไฟล์ SQLite บนดิสก์ถาวรของ Render
# (ถ้าอยากใช้ฟรี: เปลี่ยน plan เป็น free, ลบส่วน disk/DB_PATH แล้วใส่ TURSO_URL + TURSO_TOKEN แทน — ดู README)
services:
  - type: web
    name: shuk-sueng-meuang
    runtime: node
    plan: starter
    region: singapore
    buildCommand: echo "no build needed"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/game.db
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
