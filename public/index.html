<title>ศึกชิงเมือง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky status header, pixel-art scene canvas on top of each panel, fixed bottom tab bar. Single deep-navy look by choice. */
:root{
  --bg:#0e1326; --surface:#151c36; --surface2:#1f2848; --line:#2d3965;
  --fg:#eef0f8; --muted:#9aa4c8;
  --brass:#f0b93c; --blood:#d0584a; --moss:#7fc06a; --steel:#5fb4ff; --violet:#b48cff;
  --f-display:'Kanit',system-ui,sans-serif; --f-body:'Sarabun',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:400 16px/1.5 var(--f-body);
  padding-block:0 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
#status{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font:700 22px/1.2 var(--f-display);letter-spacing:.01em;color:var(--brass)}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:600}
.bars{display:grid;gap:5px;margin-top:8px}
.m{display:grid;grid-template-columns:40px 1fr 64px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.m em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;transition:width .25s}
.m.big{grid-template-columns:48px 1fr 76px;font-size:14px}
.m.big .bar{height:12px}
main{display:grid;gap:14px;padding-top:14px}
h2{font:700 20px/1.3 var(--f-display);margin:0;text-wrap:balance}
h3{font:500 15px/1.3 var(--f-display);margin:0 0 8px;color:var(--muted);letter-spacing:.04em}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:12px;min-width:0}
.hint{color:var(--muted);font-size:14px}
.btn{font:600 15px/1.2 var(--f-body);min-height:44px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer;text-align:center}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1b1608}
.btn.danger{background:var(--blood);border-color:var(--blood);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{padding:8px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .btn{padding:8px 4px;font-size:14px}
.btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:rgba(240,185,60,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:4px;padding:2px 8px;border-radius:4px;background:var(--surface2);font-size:13px;font-variant-numeric:tabular-nums}
.chip.lack{color:var(--blood)}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item .nm{font-weight:600}
.item .st{color:var(--muted);font-size:14px}
.qb{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor;vertical-align:middle}
/* ช่องอุปกรณ์สวมใส่แบบตุ๊กตา */
.doll{display:grid;grid-template-columns:1fr 128px 1fr;gap:8px;align-items:center}
.dcol{display:grid;gap:8px}
.slot{position:relative;aspect-ratio:1/1;border-radius:10px;border:2px solid #5a6080;background:linear-gradient(160deg,#4a5068,#2a2f44);display:flex;align-items:center;justify-content:center;font-size:26px;color:inherit;padding:0;cursor:pointer;min-width:0}
.slot .lv{position:absolute;left:0;right:0;bottom:2px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot .pl{position:absolute;right:3px;top:1px;font-size:11px;font-weight:800;color:#ffe27a;text-shadow:0 1px 2px #000}
.slot .sk{position:absolute;left:3px;top:1px;font-size:11px;font-weight:800;color:#7ad7ff;text-shadow:0 1px 2px #000}
.slot .lk{position:absolute;right:2px;bottom:12px;font-size:10px}
.slot.e{opacity:.45;font-size:22px}
.slot.s0{background:linear-gradient(160deg,#6a7090,#3a4058);border-color:#9aa0b8}
.slot.s1{background:linear-gradient(160deg,#3f9a52,#1f4a2c);border-color:#5fd16f}
.slot.s2{background:linear-gradient(160deg,#3a8ad8,#1c3f72);border-color:#5fb4ff}
.slot.s3{background:linear-gradient(160deg,#8a5ae0,#41286e);border-color:#b48cff}
.slot.s4{background:linear-gradient(160deg,#f0a030,#7a4a10);border-color:#ffc04a}
.slot.s5{background:linear-gradient(160deg,#ff6a6a,#702020);border-color:#ff9a9a;box-shadow:0 0 10px #ff5a5a88}
.dollc{width:128px;height:150px;display:block;margin:auto;image-rendering:pixelated}
.q0{color:#e8eaf2}.q1{color:#5fd16f}.q2{color:#5fb4ff}.q3{color:#b48cff}.q4{color:#ff9a3c}.q5{color:#ff5a5a}
.qb.q5{box-shadow:0 0 8px #ff5a5a88}.qb.q4{box-shadow:0 0 6px #ff9a3c66}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,18,.78)}
.modal .card{width:100%;max-width:360px;margin:0;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.pend{border-color:var(--brass)}.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.oddrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;color:var(--muted);font-size:14px}
.fab{position:fixed;right:12px;bottom:68px;z-index:30;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--brass);color:#1a1405;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.fab[hidden],.cpanel[hidden]{display:none}
.dqfab{position:fixed;right:12px;bottom:132px;z-index:31;width:52px;height:52px;border-radius:50%;border:2px solid var(--brass);background:var(--surface2);color:var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;box-shadow:0 4px 14px rgba(0,0,0,.5);touch-action:none;user-select:none;-webkit-user-select:none;font:700 11px/1.1 var(--f-display);padding:0}
.dqfab[hidden]{display:none}.dqfab.dragging{cursor:grabbing;opacity:.85}.dqfab svg{pointer-events:none}.dqfab .badge{pointer-events:none}
.dqpanel{position:fixed;left:8px;right:8px;top:7vh;max-height:80vh;overflow:auto;z-index:45;max-width:520px;margin:0 auto;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.65)}.dqpanel .card{margin:0;border-color:var(--brass);background:var(--surface)}
.dqpanel[hidden]{display:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--blood);color:#fff;font:600 12px/20px var(--f-display);text-align:center}
.cpanel{position:fixed;left:0;right:0;bottom:56px;z-index:40;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:10px 12px;box-shadow:0 -8px 30px rgba(0,0,0,.55)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.chead b{flex:1}
.cpeers{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;font-size:13px;color:var(--muted)}.cpeers div{white-space:nowrap;padding:2px 8px;border-radius:4px;background:var(--surface2)}.cpeers .me{color:var(--brass)}
.cpanel .chatlog{height:min(36vh,260px)}
.chatlog{height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);font-size:14px;margin-bottom:8px}
.cm{padding:2px 0;word-break:break-word}.cm b{color:var(--brass);font-weight:600}
.chatrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.item .chips{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:4px;padding:10px 12px}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600}
.tag.own{background:rgba(127,192,106,.18);color:var(--moss)}
.tag.foe{background:rgba(208,88,74,.2);color:#f0907f}
.map{width:100%;height:auto;display:block}
.map text{font-family:var(--f-body)}
.log ol{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.log li:first-child{color:var(--fg)}
.blog{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px;min-height:96px}
.blog li{color:var(--muted)}
.blog li:first-child{color:var(--fg)}
.win{border-color:var(--brass);background:#231f26}
.threat{display:grid;gap:4px}
canvas.scene{width:100%;height:auto;display:block;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.cosgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.cosb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:2px solid;border-radius:8px;background:var(--surface2);color:inherit;font:inherit;font-size:11px;line-height:1.2;text-align:center;cursor:pointer;min-width:0}
.cosb[aria-pressed=true]{background:rgba(232,194,106,.16)}
.cosb span{overflow-wrap:anywhere}
.pick .btn{min-height:40px;padding:6px 12px;font-size:14px}
.pick .sw{width:40px;padding:0}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.clsbtn{text-align:left;display:grid;gap:2px;padding:10px 12px}
.clsbtn b{font:500 15px/1.3 var(--f-display)}
.clsbtn span{font-weight:400;font-size:13px;color:var(--muted)}
.r1{color:var(--steel)} .r2{color:var(--violet)} .r3{color:var(--brass)}
.reveal{background:var(--surface2);border:1px solid var(--brass);border-radius:4px;padding:10px 12px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0;padding-top:0}
.srow .v{font:700 18px/1 var(--f-display);min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.srow .btns{display:flex;gap:6px}
.srow .btn{min-height:40px;min-width:44px;padding:4px 10px}
.skill{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0;padding-top:0}
.skill .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.skill .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.skic{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);image-rendering:pixelated;flex:none}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--surface2);display:block}
.pips i.on{background:var(--brass)}
.sk-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sk-btns .btn{padding:6px 4px;font-size:13px;min-height:54px}
.sk-btns .btn .hint{font-size:12px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mem div{background:var(--surface2);border-radius:4px;padding:6px 8px;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .me{outline:1px solid var(--brass)}
.mem .empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}
input.txt{font:400 16px var(--f-body);min-height:44px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:rgba(95,180,255,.18);color:var(--steel)}
.clock{font-size:12px;margin-top:6px}
[hidden]{display:none!important}
.login{display:grid;place-items:start center;padding-block:24px}
.login-in{width:100%;max-width:360px;display:grid;gap:12px}
.login h1{font:700 32px/1.2 var(--f-display);color:var(--brass);margin:0;text-align:center}
.login form{display:grid;gap:10px}
.login label{font-size:14px;color:var(--muted)}
.login .chk{display:flex;align-items:center;gap:8px;min-height:32px}
.login .chk input{width:20px;height:20px;margin:0}
.loginmsg{min-height:22px;font-size:14px;color:#f0907f}
.loginmsg.ok{color:var(--moss)}
input.txt:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.pairs{display:grid;gap:4px}
.pair{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center;font-size:13px;padding:6px 8px;background:var(--surface2);border-radius:4px;min-width:0}
.pair div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair.me{outline:1px solid var(--brass)}
.pill.buff{background:rgba(127,192,106,.2);color:var(--moss)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);gap:0}
nav.lock{opacity:.45;pointer-events:none}
.tab{font:500 11px/1.2 var(--f-display);min-height:48px;padding:0 2px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--surface2);color:var(--brass)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<section id="login" class="login">
  <div class="login-in">
    <canvas id="loginHero" class="scene" width="320" height="170" aria-hidden="true"></canvas>
    <h1>ศึกชิงเมือง</h1>
    <form id="loginForm" novalidate>
      <label for="uid">ไอดี</label>
      <input class="txt" id="uid" name="username" type="text" autocomplete="username" maxlength="16" autocapitalize="none" spellcheck="false" placeholder="เช่น hero_01">
      <label for="pwd">รหัสผ่าน</label>
      <input class="txt" id="pwd" name="password" type="password" autocomplete="current-password" maxlength="32" placeholder="อย่างน้อย 6 ตัวอักษร">
      <label class="chk" for="showpw"><input type="checkbox" id="showpw"> แสดงรหัสผ่าน</label>
      <div id="loginMsg" class="loginmsg" role="alert" aria-live="polite"></div>
      <button class="btn primary" type="submit" id="btnLogin">เข้าเกมส์</button>
      <button class="btn" type="button" id="btnReg">สมัครไอดี</button>
    </form>
    <p class="hint">บัญชีเก็บอยู่ในเบราว์เซอร์ของเครื่องนี้ ไม่มีเซิร์ฟเวอร์กลาง จึงใช้ไอดีเดียวกันข้ามเครื่องไม่ได้ และกู้รหัสผ่านที่ลืมไม่ได้</p>
  </div>
</section>
<div class="wrap" id="gameWrap" hidden>
  <header id="status"></header>
  <main>
    <div id="view"></div>
    <div id="logbox"></div>
  </main>
</div>
<nav id="nav" hidden></nav>
<button id="chatFab" class="fab" data-a="chatopen" aria-label="เปิดแชท" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span id="chatBadge" class="badge" hidden></span></button>
<button id="dqFab" class="dqfab" aria-label="ภารกิจประจำวัน" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span id="dqPts">0</span><span class="badge" id="dqBadge" hidden>!</span></button>
<section id="dqPanel" class="dqpanel" role="dialog" aria-label="ภารกิจประจำวัน" hidden></section>
<section id="chatPanel" class="cpanel" role="dialog" aria-label="แชทรวม" hidden>
 <div class="chead"><b>แชทรวม</b><span class="meta" id="chatCount"></span><button class="btn" data-a="chatclose" aria-label="ปิดแชท">ปิด</button></div>
 <div class="cpeers" id="peers"></div>
 <div class="chatlog" id="chatlog"></div>
 <div class="chatrow" id="chatrow"><input class="txt" id="chatin" type="text" maxlength="100" placeholder="พิมพ์ข้อความ" aria-label="ข้อความแชท" autocomplete="off"><button class="btn primary" data-a="chatsend">ส่ง</button></div>
</section>

<script>
(function(){
// ===== โหมดการทำงาน: offline = เล่นในเบราว์เซอร์ (Artifact) · client = หน้าเว็บที่คุยกับเซิร์ฟเวอร์ · server = เครื่องยนต์เกมบนเซิร์ฟเวอร์ (ตัดสินผลทุกอย่าง กันโกง) =====
var MODE=(typeof window!=='undefined'&&window.GAME_MODE)||'offline',SV=MODE==='server',CL=MODE==='client';
var SAVE='shuk-sueng-meuang-v1',LEGACY_SAVE='shuk-sueng-meuang-v1';
var E_MS=180000,PERIOD_MS=21600000,FIGHT_CD=10000,HUNT_CD=3000;
var RES={wood:'ไม้',stone:'หิน',ore:'แร่',hide:'หนัง',herb:'สมุนไพร',purple:'แร่หินสีม่วง'};

/* ---------- ข้อมูลเกม ---------- */
var CLASSES={
 warrior:{n:'นักดาบ',hp:0,mp:0,atk:0,def:0,crit:0,dodge:0,eye:'#4aa3ff',base:'#b8433a',trim:'#e8c26a',
  w:['ดาบสนิม','ดาบไม้เนื้อแข็ง','ดาบเหล็กกล้า','ดาบเงินบริสุทธิ์','ดาบอัญมณี','ดาบเกล็ดมังกร','ดาบเทพปกรณัม']},
 rogue:{n:'นักฆ่า',hp:0,mp:0,atk:0,def:0,crit:0,dodge:0,eye:'#c08cff',base:'#4a3a7a',trim:'#9a7cff',
  w:['มีดสนิม','มีดคู่ไม้เนื้อแข็ง','มีดคู่เหล็กกล้า','มีดคู่เงินบริสุทธิ์','มีดคู่อัญมณี','มีดคู่เกล็ดมังกร','มีดคู่เทพปกรณัม']},

 var snap=mySnap(),k=JSON.stringify(snap);if(k===ON.last)return;
 clearTimeout(ON.timer);

  if(ON.busy||!s||s.battle)return;ON.busy=true;snap=mySnap();snap.upd=Date.now();var kk=JSON.stringify(mySnap());
  ON.db.doc('ladder/'+ON.uid).set(snap).then(function(){ON.last=kk}).catch(function(){}).then(function(){ON.busy=false});facWriteSafe();
 },2500)}
function initOnline(){

 Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
  var db=r[0],us=r[1];if(!db||!us)return;
  return Promise.resolve(us.id()).then(function(id){
   if(!id)return;ON.uid=String(id);ON.db=db;
   return Promise.resolve(us.can?us.can('data.write'):null).then(function(cw){
    ON.canWrite=cw!==false;ON.ok=true;
    if(s&&!s.battle&&(s.tab==='me'||!s.created))render();
    chatUI();
    ON.unsub=db.collection('ladder').orderBy('rating','desc').limit(60).onSnapshot(function(snap){
     ON.board=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x}).filter(function(x){return typeof x.n==='string'&&CLASSES[x.cls]&&x.lvl>0});
     if(s&&s.tab==='pvp'&&!s.battle)render();
    },function(){ON.ok=false});
    onlineSync();
    try{db.collection('chat').orderBy('ts','desc').limit(40).onSnapshot(function(snap){
     ON.chat=snap.docs.map(function(d){return d.data()||{}}).filter(function(m){return typeof m.t==='string'&&typeof m.n==='string'}).sort(function(a,b){return (a.ts||0)-(b.ts||0)});
     if(ON.seen<0)ON.seen=ON.chat.length?(ON.chat[ON.chat.length-1].ts||0):0;
     paintChat();chatUI();
    },function(){})}catch(e){}
    claude.use('room').then(function(room){
     if(!room)return;ON.room=room;presenceSet();
     room.onPeers(function(ch){ON.peers=ch.peers||[];paintChat()},function(){});
    }).catch(function(){});

     if(snap.metadata&&snap.metadata.fromCache)return;

     facSettle();
     if(s&&!s.battle&&!s.res&&(s.tab==='guild'||s.tab==='pvp'))render();
    },function(){})}catch(e){}}
    sub('wars','fac',300,16,function(x){return typeof x.fac==='number'&&x.fac>=0&&x.fac<4&&typeof x.n==='string'});
   })})}).catch(function(){})}

function guildStats(gid){
 var mem=ON.gmem.filter(function(x){return x.gid===gid}),tot=0;
 mem.forEach(function(x){tot+=(x.id===ON.uid&&s.guild&&s.guild.gid===gid)?Math.max(s.guild.don|0,x.don|0):(x.don|0)});
 var lv=lvFromDon(tot);return {mem:mem,lvl:lv.lvl,exp:lv.exp,tot:tot}}
function myMemberDoc(){return {gid:s.guild.gid,n:nick().slice(0,16),cls:s.cls,lvl:s.lvl,don:s.guild.don|0,upd:Date.now()}}

  if(!gd){
   // กิลด์เพิ่งสร้าง เอกสารกิลด์อาจยังไม่ซิงก์กลับมา: หัวหน้าให้บันทึกซ้ำ ส่วนคนอื่นรอ 30 วินาทีก่อนถือว่ายุบจริง
   if(me.gid===ON.uid&&s.guild&&s.guild.gid===ON.uid){
    if(Date.now()-(ON.gRetry||0)>8000){ON.gRetry=Date.now();ON.db.doc('guilds/'+ON.uid).set({n:s.guild.n,created:Date.now()}).catch(function(){s.guildMsg='บันทึกกิลด์ไม่สำเร็จ บัญชีนี้อาจไม่มีสิทธิ์เขียนข้อมูล';render()})}
    return}
   if(Date.now()-(me.upd||0)<30000)return;
   ON.miss2=(ON.miss2|0)+1;if(ON.miss2<3)return;ON.miss2=0;
   ON.db.doc('gmem/'+ON.uid).delete().catch(function(){});ON.gmem=ON.gmem.filter(function(x){return x.id!==ON.uid});s.guild=null;s.guildMsg='กิลด์ที่คุณอยู่ถูกยุบแล้ว';recalc();save();return}
  ON.miss=0;ON.miss2=0;
  var st=guildStats(me.gid),old=s.guild?s.guild.lvl:0,keep=had===me.gid?s.guild:null;

  s.guild={n:gd.n,gid:me.gid,at:keep?(keep.at||0):0,pend:keep&&keep.pend?true:undefined,lvl:st.lvl,exp:st.exp,cp:keep?(keep.cp|0):0,don:myDon,
   members:st.mem.slice().sort(function(a,b){return (b.lvl|0)-(a.lvl|0)}).map(function(x){return {n:x.n,cls:x.cls,lvl:x.lvl|0,uid:x.id,role:x.id===me.gid?'หัวหน้า':'สมาชิก',me:x.id===ON.uid}})};
  if(old!==st.lvl)recalc();
 }else if(had&&!s.guild.pend&&Date.now()-(s.guild.at||0)>60000){ON.miss=(ON.miss|0)+1;if(ON.miss>=3){ON.miss=0;s.guild=null;recalc()}}

function warScore(w){var a=0,b=0;w.pairs.forEach(function(p){var ra=wresOf(p[0]),rb=wresOf(p[1]);if(ra&&ra.wid===w.wid&&ra.win)a++;if(rb&&rb.wid===w.wid&&rb.win)b++});return [a,b]}
function activeWarOf(gid){var now=Date.now();return ON.wars.filter(function(w){return (w.a===gid||w.b===gid)&&w.end>now})[0]||null}
function nameOfU(u){var m=ON.gmem.filter(function(x){return x.id===u})[0];return m?m.n:'?'}
function warSettle(){
 if(!ON.ok||!s||!s.created||(ON.gl&12)!==12||!s.guild||!s.guild.gid)return;
 var now=Date.now();s.warClaim=s.warClaim||{};
 ON.wars.forEach(function(w){
  if(w.end>now||s.warClaim[w.wid])return;
  var mine=false,side=0;w.pairs.forEach(function(p){if(p[0]===ON.uid){mine=true;side=0}if(p[1]===ON.uid){mine=true;side=1}});
  if(!mine)return;
  var sc=warScore(w),a=sc[side],b=sc[1-side],res=a>b?'win':a<b?'lose':'draw';
  var gold=res==='win'?200:res==='draw'?100:50,cp=res==='win'?60:res==='draw'?30:15;
  s.warClaim[w.wid]=true;var ks=Object.keys(s.warClaim);if(ks.length>6)delete s.warClaim[ks[0]];
  s.gold+=gold;s.guild.cp+=cp;
  var en=side===0?w.bN:w.aN;
  s.warLast={res:res,a:a,b:b,enemy:en,gold:gold,cp:cp,gx:0};
  say('กิลวอร์กับ '+en+' จบแล้ว '+(res==='win'?'ชนะ':res==='lose'?'แพ้':'เสมอ')+' '+a+'–'+b+' · ทอง +'+gold+' แต้มสะสม +'+cp);
  save();
 });
}
function warDeclare(target){
 var g=s.guild;if(!ON.ok||!ON.canWrite||!g||!g.gid||g.gid!==ON.uid)return;
 var now=Date.now(),tg=ON.guilds.filter(function(x){return x.id===target})[0];
 if(!tg||target===g.gid||activeWarOf(g.gid)||activeWarOf(target)){s.guildMsg='ประกาศสงครามไม่ได้ (กิลด์นั้นกำลังทำสงครามอยู่)';return}
 var A=guildStats(g.gid).mem.slice().sort(function(a,b){return (b.lvl|0)-(a.lvl|0)}),B=guildStats(target).mem.slice().sort(function(a,b){return (b.lvl|0)-(a.lvl|0)});
 var k=Math.min(A.length,B.length);
 if(k<4){s.guildMsg='ทั้งสองกิลด์ต้องมีสมาชิกอย่างน้อย 4 คน';return}
 var pairs=[];for(var i=0;i<k;i++)pairs.push([A[i].id,B[i].id]);
 var w={wid:g.gid+'-'+now,a:g.gid,b:target,aN:g.n,bN:tg.n,start:now,end:now+86400000,pairs:pairs};
 ON.wars=ON.wars.filter(function(x){return x.id!==g.gid});ON.wars.push(Object.assign({id:g.gid},w));
 ON.db.doc('wars/'+g.gid).set(w).catch(function(){});
 s.warLast=null;s.guildMsg='ประกาศสงครามกับ '+tg.n+' แล้ว จับคู่ '+k+' คู่ เวลา 24 ชม.';say('กิลวอร์: ประกาศสงครามกับ '+tg.n);
}
function warFightOn(){

 if(!partner||s.warWon===aw.wid)return;

 s.energy-=3;s.warTry={wid:aw.wid,p:periodId()};

 });

function localMs(ms){return ms-new Date(ms).getTimezoneOffset()*60000}
function periodId(ms){return Math.floor(localMs(ms||Date.now())/PERIOD_MS)}

function timeTick(){
 var now=Date.now(),ch=false,n;
 if(s.eAt>now)s.eAt=now;
 if(s.rAt>now)s.rAt=now;
 if(s.energy>=s.maxEnergy){s.eAt=now}
 else if(now-s.eAt>=E_MS){
  n=Math.floor((now-s.eAt)/E_MS);
  s.energy=Math.min(s.maxEnergy,s.energy+n);
  s.eAt=s.energy>=s.maxEnergy?now:s.eAt+n*E_MS;ch=true;
 }
 if(s.battle||(s.hp>=s.maxhp&&s.mp>=s.maxmp)){s.rAt=now}
 else if(now-s.rAt>=E_MS){
  n=Math.floor((now-s.rAt)/E_MS);
  s.hp=Math.min(s.maxhp,s.hp+n*Math.max(1,Math.round(s.maxhp*0.1)));
  s.mp=Math.min(s.maxmp,s.mp+n*Math.max(1,Math.round(s.maxmp*0.1)));
  s.rAt=(s.hp>=s.maxhp&&s.mp>=s.maxmp)?now:s.rAt+n*E_MS;ch=true;
 }
 var cur=periodId(now);
 if(s.pAt>cur)s.pAt=cur;
 if(s.pAt<cur){
  if(cur-s.pAt>8)s.pAt=cur-8;
  while(s.pAt<cur){s.pAt++;periodTick()}
  ch=true;
 }
 if(ch)save();
 return ch;
}

function buildOpp(name,cls,lvl,pw,rating){
 var K=CLASSES[cls],st={str:0,vit:0,agi:0,int:0},keys=['str','vit','agi','int'],i;
 var bias={warrior:['str','vit'],rogue:['agi','str'],mage:['int','vit'],paladin:['vit','str'],archer:['agi','str']}[cls];
 for(i=0;i<(lvl-1)*3;i++){st[Math.random()<0.7?pick(bias):pick(keys)]++}
 var wt=Math.min(3,Math.floor((lvl+1)/5)),at=Math.min(3,Math.floor(lvl/6));
 return {n:name,cls:cls,lvl:lvl,rating:rating,look:randLook(),gold:[0,0],xp:0,drops:{},
  hp:Math.round((50+(lvl-1)*12+K.hp+st.vit*8)*pw),
  atk:Math.round((2+lvl+[3,6,12,22][wt]+K.atk+st.str*2)*pw),
  def:Math.round((ARMORS[at].d+K.def+Math.floor(st.vit/2))*pw),
  pvp:{crit:Math.min(40,5+K.crit+st.agi),dodge:Math.min(30,K.dodge+st.agi*0.8),spec:SPEC[cls],mult:1.9}};
}
var PVP_FREE=5,PVP_PRICE=500,RESET_COST=5000;
function pvpDay(){return new Date().toDateString()}
function pvpFreeLeft(){return (s.pv&&s.pv.d===pvpDay())?Math.max(0,PVP_FREE-s.pv.n):PVP_FREE}
function pvpCanPay(){return pvpFreeLeft()>0||s.gold>=PVP_PRICE}
function pvpFind(){
 if(s.battle||cdLeft()>0||!pvpCanPay())return;
 if(!s.pv||s.pv.d!==pvpDay())s.pv={d:pvpDay(),n:0};
 if(pvpFreeLeft()>0)s.pv.n++;else s.gold-=PVP_PRICE;
 var re=realOpp();
 if(re){startBattle(re,'pvp');s.battle.lines=['จับคู่กับผู้เล่นจริง: '+re.n+' ('+CLASSES[re.cls].n+' Lv'+re.lvl+' · เรทติ้ง '+re.rating+')'];return}
 var op=Math.max(0,s.pvp.r+rnd(-80,80));
 var lvl=Math.max(1,Math.min(60,s.lvl+Math.round((op-1000)/150)+rnd(-1,1)));
 var e=buildOpp(pick(NPC_NAMES)+rnd(10,99),pick(CLS_ORDER),lvl,1.1+Math.max(0,op-1000)/2000+Math.random()*0.2,op);
 startBattle(e,'pvp');
 s.battle.lines=['จับคู่ได้แล้ว: '+e.n+' ('+CLASSES[e.cls].n+' Lv'+lvl+' · เรทติ้ง '+op+')'];
}
function myPair(){
 var w=s.war;if(!w)return -1;
 for(var i=0;i<w.pairs.length;i++){if(s.guild.members[w.pairs[i].me].me)return i}
 return -1;
}
function warStart(){
 var g=s.guild;if(!g||s.war||g.members.length<4)return;
 var n=g.members.length,i,mine=[],foes=[];
 g.members.forEach(function(m,idx){mine.push({i:idx,lvl:m.me?s.lvl:m.lvl})});
 mine.sort(function(a,b){return b.lvl-a.lvl});
 var avg=mine.reduce(function(t,x){return t+x.lvl},0)/n;
 for(i=0;i<n;i++){var f=npcMember(1,foes);f.lvl=Math.max(1,Math.round(avg+rnd(-3,3)));foes.push(f)}
 foes.sort(function(a,b){return b.lvl-a.lvl});
 s.war={enemy:{n:pick(ENEMY_GUILDS),members:foes},left:4,tryP:0,
  pairs:mine.map(function(x,k){return {me:x.i,foe:k,r:null}})};
 s.warLast=null;
 s.guildMsg='ประกาศสงครามกับกิลด์ '+s.war.enemy.n+' จับคู่ 1-1 แล้ว '+n+' คู่ เวลา 24 ชม. (4 ช่วง ช่วงละ 6 ชม.)';
 say('กิลวอร์: ประกาศสงครามกับ '+s.war.enemy.n);
}
function warFight(){
 var w=s.war;if(!w||s.battle||s.energy<3||cdLeft()>0)return;
 var k=myPair();if(k<0)return;var pr=w.pairs[k];
 if(pr.r!==null||w.tryP===periodId())return;
 s.energy-=3;w.tryP=periodId();
 var f=w.enemy.members[pr.foe];
 var e=buildOpp(f.n,f.cls,f.lvl,1,0);
 startBattle(e,'war',{pair:k});
 s.battle.lines=['กิลวอร์: คู่ของคุณคือ '+f.n+' ('+CLASSES[f.cls].n+' Lv'+f.lvl+')'];
}
function npcDuel(a,b){return Math.random()<1/(1+Math.exp(-(a-b)*0.35))}
function warPeriod(){
 var w=s.war;if(!w||!s.guild)return;
 w.pairs.forEach(function(pr){
  if(pr.r!==null)return;
  var mm=s.guild.members[pr.me];if(mm.me)return;
  if(Math.random()<0.4)pr.r=npcDuel(mm.lvl,w.enemy.members[pr.foe].lvl)?'win':'lose';
 });
 w.left--;
 if(w.left<=0)warEnd();
}

function warEnd(){
 var w=s.war,g=s.guild,a=0,b=0,res,t=[];
 w.pairs.forEach(function(pr){
  if(pr.r===null){
   var mm=g.members[pr.me];
   pr.r=mm.me?'lose':(npcDuel(mm.lvl,w.enemy.members[pr.foe].lvl)?'win':'lose');
  }
  if(pr.r==='win')a++;else b++;
 });
 res=a>b?'win':a<b?'lose':'draw';
 var gx=res==='win'?100+10*a:res==='draw'?50:30,cp=res==='win'?60:res==='draw'?30:15,gold=res==='win'?200:res==='draw'?100:50;
 s.gold+=gold;g.cp+=cp;g.wars=g.wars||{w:0,l:0,d:0};
 g.wars[res==='win'?'w':res==='lose'?'l':'d']++;
 s.warLast={res:res,a:a,b:b,enemy:w.enemy.n,gold:gold,cp:cp,gx:gx};
 s.war=null;
 guildExp(gx);
 say('กิลวอร์จบแล้ว '+(res==='win'?'ชนะ':res==='lose'?'แพ้':'เสมอ')+' '+a+'–'+b+' · ทอง +'+gold+' แต้มสะสม +'+cp+' EXP กิลด์ +'+gx);
}

function battleAct(a){
 var b=s.battle;if(!b)return;var e=b.e,l=[],now=nowMs(),stun=false,id;
 b.cd=b.cd||{};b.buffs=b.buffs||{};
 if(a==='flee'){
  if(noFlee(b))return;
  if(Math.random()<0.6){say('หนีจาก '+e.n+' ได้');s.battle=null;fightDone(HUNT_CD);return}
  l.push('หนีไม่พ้น!');
 }else if(a==='potionf'){
  if(isDuel(b)||(s.potF|0)<1||s.hp>=s.maxhp)return;
  var hf2=s.maxhp-s.hp;s.potF--;s.hp=s.maxhp;l.push('ดื่มยาฟื้นเลือดเต็ม ฟื้น '+hf2+' HP');fl('p','+'+hf2,'#7fc06a');
 }else if(a==='potion'){
  if(potTotal()<1||s.hp>=s.maxhp)return;
  var du=isDuel(b);if(du&&(b.pots|0)>=DUEL_POTS)return;
  var h=drinkPot(du?DUEL_HP:1);if(du)b.pots=(b.pots|0)+1;
  var hs=du?h*DUEL_HP:h;l.push('ดื่มยา ฟื้น '+hs+' HP'+(du?' ('+b.pots+'/'+DUEL_POTS+' ขวด)':''));fl('p','+'+hs,'#7fc06a');
 }else if(a.indexOf('sk:')===0){
  var k=SKMAP[a.slice(3)],lv=k?skLv(k.id):0;
  if(!k||k.t==='p'||!lv||s.mp<k.mp||(b.cd[k.id]||0)>0)return;
  s.mp-=k.mp;b.cd[k.id]=k.cd+1;fx.pAtk=now;dqAdd('skill');
  if(k.t==='b'){
   b.buffs[k.id]=k.dur;l.push('ใช้ '+k.n+' ('+skDesc(k,lv)+')');fl('p',k.n,'#5fb4ff');fxBuff();
  }else{
   var tot=0,cr=0,ms=0,i;
   for(i=0;i<(k.hits||1);i++){
    if(Math.random()*100>=hitPct()){ms++;continue}
    var isCrit=k.crit||Math.random()*100<critPct();
    tot+=hit(skAtk()*lvVal(k.m,lv)*skPow()*(s.cls==='mage'?MAGE_DMG:1)*(isCrit?critMul():1),Math.round(e.def*edm(b)*(1-(k.ign||0))));
    if(isCrit)cr++;
   }
   var fd=tot>0?fxSkill(k,cr>0):180;b.ehp-=tot;fx.eHit=now+fd;
   l.push('ใช้ '+k.n+' '+e.n+(tot>0?' −'+tot:' พลาด')+(cr?' (คริติคอล!)':''));
   fl('e',tot>0?'−'+tot:'พลาด',cr?'#ff2424':'#d8b0ff',fd,cr>0);if(cr)fl('e','คริติคอล!','#ffd04a',fd);
   if(k.leech){var hl=Math.min(Math.max(1,Math.round(tot*k.leech)),s.maxhp-s.hp);if(hl>0){s.hp+=hl;l.push('ดูดเลือด +'+hl+' HP')}}
   if(k.stun)stun=true;
  }
 }else{
  var heavy=a==='heavy',cl=s.cls;
  if(heavy){if(s.energy<HEAVY_COST||(b.hv|0)>=HEAVY_MAX)return;s.energy-=HEAVY_COST;b.hv=(b.hv|0)+1}
  fx.pAtk=now;
  if(e.pvp&&Math.random()*100<e.pvp.dodge){l.push(e.n+' หลบการโจมตีได้');fl('e','หลบ','#c8cde0',200)}
  else if(!heavy&&Math.random()*100>=hitPct()){l.push('โจมตีพลาดเป้า!');fl('e','พลาด','#c8cde0',200)}
  else if(heavy&&Math.random()<0.5){l.push('ฟันหนักพลาดเป้า!');fl('e','พลาด','#c8cde0',200)}
  else{
   var mult=heavy?1.9:1,crit=Math.random()*100<critPct();
   if(crit)mult*=critMul();
   var d=hit(pAtk()*mult,Math.round(e.def*edm(b))),extra=0;
   
   b.ehp-=d+extra;fx.eHit=now+180;fxPlayerHit(crit,heavy);
   l.push((heavy?'ฟันหนัก ':'โจมตี ')+e.n+' −'+d+(crit?' (คริติคอล!)':'')+(extra?' + ยิงซ้ำ −'+extra:''));
   fl('e','−'+(d+extra),crit?'#ff2424':'#ffffff',180,crit);if(crit)fl('e','คริติคอล!','#ffd04a',180);
  }
 }
 if(b.ehp>0){
  b.turn=(b.turn||0)+1;
  if(stun){l.push(e.n+' มึนงง ข้ามการโจมตี')}
  else if(Math.random()*100<dodgePct()){l.push('หลบการโจมตีของ '+e.n+' ได้!');fl('p','หลบ','#5fb4ff',560)}
  else{
   var mul=1,tag='';
   if(e.pvp){
    if(b.turn%3===0){mul=e.pvp.mult;tag=' ('+e.pvp.spec+')'}
    if(Math.random()*100<e.pvp.crit){mul*=2;tag+=' คริติคอล!'}
   }
   var msk=null;
   if(!e.pvp&&!e.cls&&b.kind==='monster'&&!b.tower&&!(s.zone<EASY_ZONES&&!e.boss)){
    if(e.boss){if(Math.random()<BOSS_SK_P){msk=pick(BOSS_SKS);mul=msk.m;tag=' ใช้สกิล '+msk.n+'!'}}
    else if(Math.random()<MOB_SK_P){var nn=0,ci;for(ci=0;ci<e.n.length;ci++)nn+=e.n.charCodeAt(ci);msk={n:MOB_SKN[nn%MOB_SKN.length],m:1.8};mul=msk.m;tag=' ใช้สกิล '+msk.n+'!'}
   }
   var dm=hit(e.atk*eam(b)*mul,pDef());s.hp-=isDuel(b)?Math.max(1,Math.ceil(dm/DUEL_HP)):dm;l.push(e.n+' ตอบโต้'+tag+' −'+dm);
   if(msk&&msk.heal){var hh=Math.min(Math.round(dm*msk.heal),e.hp-b.ehp);if(hh>0){b.ehp+=hh;l.push(e.n+' ดูดเลือด +'+hh)}}fx.eAtk=now+380;fx.pHit=now+560;var ecr=tag.indexOf('คริติคอล')>=0;fxEnemyHit(!!msk||ecr,!!e.boss,560);if(msk)fl('e',msk.n+'!','#ff9a3c',200);fl('p','−'+dm,ecr?'#ff2424':'#ff7a6a',560,ecr)}
 }
 if(b.ehp>0&&s.hp>0){
  if(j2Mul(b)>0&&dbf('dot')>0){var dl=Math.max(1,Math.round(e.hp*dbf('dot')*j2Mul(b)));b.ehp-=dl;l.push(e.n+' ถูกพิษ −'+dl);fl('e','−'+dl,'#9be36a',300)}
  var rg=Math.round(bb('regen'));
  if(rg>0&&s.hp<s.maxhp){var r2=Math.min(rg,s.maxhp-s.hp);s.hp+=r2;l.push('ฟื้นฟู +'+r2+' HP')}
  s.mp=Math.min(s.maxmp,s.mp+2+Math.floor(s.st.int/5));
  for(id in b.cd){if(b.cd[id]>0)b.cd[id]--}
  for(id in b.buffs){if(b.buffs[id]>0)b.buffs[id]--}
 }
 b.lines=l.slice().reverse().concat(b.lines).slice(0,6);
 if(b.ehp<=0){return win()}
 if(s.hp<=0){return lose()}
}
function autoAct(){
 var b=s.battle;
 if(b&&b.e&&b.e.boss&&!b.tower&&s.autoBoss==='stop'&&s.autoHunt){s.autoHunt=false;s.autoMsg='ออโต้หยุด: เจอบอส (สู้เองได้เลย)';say('เจอบอส! ออโต้หยุดทำงาน');return}
 if(potOn()&&s.hp<s.maxhp*potThr()&&potTotal()>0&&s.hp<s.maxhp&&!(isDuel(b)&&(b.pots|0)>=DUEL_POTS))return battleAct('potion');
 if(s.hp<s.maxhp*0.2&&!noFlee(b))return battleAct('flee');
 if(s.autoSkill){
  var ks=SK[s.cls].slice(1).filter(function(k){return skLv(k.id)>0&&s.skAuto[k.id]!==false&&s.mp>=k.mp&&!((b.cd||{})[k.id]>0)});
  var buff=ks.filter(function(k){return k.t==='b'&&!((b.buffs||{})[k.id]>0)})[0];
  if(buff)return battleAct('sk:'+buff.id);
  var atks=ks.filter(function(k){return k.t==='a'}).sort(function(x,y){
   return lvVal(y.m,skLv(y.id))*(y.hits||1)-lvVal(x.m,skLv(x.id))*(x.hits||1)});
  if(atks.length)return battleAct('sk:'+atks[0].id);
 }
 battleAct('atk');
}
function win(){
 var b=s.battle,e=b.e,p=[];
 if(noFlee(b))return duelEnd(true);
 if(b.tower)dqAdd('tower');else dqAdd('hunt');
 var g=Math.round(rnd(e.gold[0],e.gold[1])*(phaseNow()%2===0?1.1:1)*gGoldMul(s)*(s.battle&&s.battle.tower?1:HUNT_GOLD));s.gold+=g;p.push('ทอง +'+g);
 var xp=Math.round(e.xp*(phaseNow()%2===1?1.1:1));p.push('XP +'+xp);s.kills++;
 if(!b.tower&&s.hp<s.maxhp){p.push('เลือดฟื้นเต็ม');s.hp=s.maxhp} // ล่าชนะ = เติมเลือดเต็ม (หอคอยไม่เติม)
 if(!b.tower&&!e.cls&&Math.random()<CARD_P){var cd0=rollCard(e.n);p.push('ได้การ์ด '+cardName(cd0)+' ('+CARDC[cd0.c].n+')')}
 if(e.boss&&Math.random()<BOSS_DROP){
  var slotsB=['w','helm','armor','gloves','boots','ring','neck','brooch'],sb=pick(slotsB),zi=Math.max(0,Math.min(5,e.zi!==undefined?e.zi:s.zone));
  var drop=sb==='w'?{k:'w',i:zi+1,g:0,t:3,boss:true}:{k:'x',i:sb,g:zi,t:3,boss:true};
  if(isDup(drop)&&!s.dup){s.dup={n:pendName(drop),amt:zi+1,until:Date.now()+DUP_MS};p.push('ได้ของซ้ำ '+pendName(drop)+' รอกดย่อย')}
  else if(s.pend||s.dup){var gsell=pendPrice(drop);s.gold+=gsell;p.push('ดรอป '+pendName(drop)+' (ม่วง) ขายอัตโนมัติ +'+gsell)}
  else{s.pend=drop;p.push('ดรอปอุปกรณ์สีม่วง: '+pendName(drop))}
 }
 if(b.tower&&s.tower.f===b.tower){var T=s.tower;T.f++;T.best=Math.max(T.best,b.tower);p.push('ผ่านชั้น '+b.tower);
  if(b.tower%10===0){var bg=Math.round(b.tower*50*0.2),pu=b.tower/10;s.gold+=bg;addItem('purple',pu);p.push('โบนัสผ่านชั้น ทอง +'+bg+', แร่หินสีม่วง +'+pu)}}
 say('ชนะ '+e.n+' ('+p.join(', ')+')');
 if(b.tower)s.res={won:true,n:e.n,kind:'tower',f:b.tower,text:s.log[0].replace(/^.*? · /,''),until:Date.now()+TW_WAIT};
 s.battle=null;fightDone(HUNT_CD);s.mp=Math.min(s.maxmp,s.mp+Math.round(s.maxmp*0.25));gainXp(xp);
}
function lose(){
 if(noFlee(s.battle))return duelEnd(false);
 var lost=s.battle.tower?0:Math.floor(s.gold*DEATH_LOSS);s.gold-=lost;s.autoHunt=false;s.autoTower=false;s.autoMsg='ออโต้หยุด: พ่ายแพ้';
 var n=s.battle.e.n,twf=s.battle.tower;s.battle=null;fightDone(HUNT_CD);
 say('ถูก '+n+' ฟาดจนสลบ เสียทอง '+lost+' แล้วฟื้นขึ้นมาด้วย HP ครึ่งหนึ่ง');
 if(twf)s.res={won:false,n:n,kind:'tower',f:twf,text:s.log[0].replace(/^.*? · /,''),until:Date.now()+TW_WAIT};
 s.hp=Math.max(1,Math.floor(s.maxhp/2));save();
}
// PvP/กิลวอร์: เริ่มสู้เลือดเต็ม จบแล้วคืน HP เท่าก่อนสู้
function duelEnd(won){var h0=s.battle&&s.battle.hp0;duelEnd0(won);if(typeof h0==='number'){s.hp=Math.max(1,Math.min(s.maxhp,h0));save()}}
function duelEnd0(won){
 var b=s.battle,e=b.e,p=[];s.battle=null;fightDone();
 s.mp=Math.min(s.maxmp,s.mp+Math.round(s.maxmp*0.25));
 if(b.kind==='pvp'){
  dqAdd('pvp');var P=s.pvp,d=eloDelta(P.r,e.rating,won);
  if(won){
   P.r+=d;P.w++;P.streak++;P.best=Math.max(P.best,P.r);
   var g=Math.round((15+s.lvl*3)*(1+Math.min(5,P.streak-1)*0.1));
   s.gold+=g;p.push('เรทติ้ง +'+d,'ทอง +'+g);
   if(P.streak>1)p.push('ชนะติด '+P.streak);
   s.hp=s.maxhp;
   say('ชนะ PvP '+e.n+' ('+p.join(', ')+')');
  }else{
   P.r=Math.max(0,P.r-d);P.l++;P.streak=0;s.hp=s.maxhp;
   say('แพ้ PvP '+e.n+' (เรทติ้ง −'+d+')');
  }

 }else if(b.onFac){
   var tr=s.facTry;
   if(won){var xpf=Math.round((30+s.lvl*3)*XP_MUL);s.gold+=60;if(tr&&tr.wid===b.onFac)tr.pt++;say('สงครามสี่ฝ่าย: ชนะ '+e.n+' (+1 แต้มให้ฝ่าย, ทอง +60, XP +'+xpf+')');gainXp(xpf)}
   else say('สงครามสี่ฝ่าย: แพ้ '+e.n);
   facWriteSafe();
 }else if(b.onWar){
   if(won){
    var xp3=Math.round((30+s.lvl*3)*XP_MUL);s.gold+=60;s.warWon=b.onWar;wresWrite(b.onWar,true);
    say('กิลวอร์: ชนะ '+e.n+' คู่ของคุณ (ทอง +60, XP +'+xp3+')');gainXp(xp3);
   }else{
    s.hp=Math.max(1,Math.floor(s.maxhp*0.5));if(s.warWon!==b.onWar)wresWrite(b.onWar,false);
    say('กิลวอร์: แพ้ '+e.n+' ในช่วงนี้ ลองใหม่ได้ในช่วงถัดไป');
   }

 }else if(s.war&&s.war.pairs[b.pair]){
  if(won){
   s.war.pairs[b.pair].r='win';var xp2=Math.round((30+s.lvl*3)*XP_MUL);s.gold+=60;
   say('กิลวอร์: ชนะ '+e.n+' คู่ของคุณ (ทอง +60, XP +'+xp2+')');gainXp(xp2);
  }else{
   s.hp=Math.max(1,Math.floor(s.maxhp*0.5));
   say('กิลวอร์: แพ้ '+e.n+' ในช่วงนี้ ลองใหม่ได้ในช่วงถัดไป');
  }
 }
 if(b.kind==='pvp'||b.kind==='war')s.res={won:won,n:e.n,cls:e.cls,lvl:e.lvl,kind:b.kind,text:s.log[0].replace(/^.*? · /,''),until:Date.now()+FIGHT_CD};
}

function craftCost(type,i,g){return type==='w'?WEAPONS[i].cost:type==='a'?ARMORS[i].cost:scaleCost(ACC[i].cost,g+1)}
function craftLv(type,i,g){return type==='w'?LV_REQ[i-1]:type==='x'?LV_REQ[g]:0}
function dqSnap(){var a=s.gold;Object.keys(s.inv).forEach(function(k){a+=(s.inv[k]|0)*7});return a+'|'+(s.pend?1:0)+'|'+(s.erst?1:0)}
function craft(type,i,g){var _b=dqSnap();craft0(type,i,g);if(dqSnap()!==_b)dqAdd('craft')}

var CRAFT_MAX=20;
function craftDay(){if(!s.crd||s.crd.d!==dqDay())s.crd={d:dqDay(),n:0};return s.crd}
function craftLeft(){return Math.max(0,CRAFT_MAX-craftDay().n)}
function craft0(type,i,g){
 if(s.pend)return;g=g|0;
 if(craftLeft()<=0){say('คราฟครบ '+CRAFT_MAX+' ชิ้นของวันนี้แล้ว');return}
 var cost=craftCost(type,i,g);
 if(!cost||!can(cost)||s.lvl<craftLv(type,i,g))return;pay(cost);craftDay().n++;
 // โอกาสแตก 10% ทุกอย่าง: เสียวัตถุดิบไปเปล่า
 if(Math.random()<BREAK_P){s.pend={k:type,i:i,g:g,t:0,fail:true};say('คราฟแตก! วัตถุดิบหายหมด');return}
 var q=rollQ();s.pend={k:type,i:i,g:g,t:q,sk:rollSk(),by:nick()};
 say('คราฟสำเร็จ ได้ระดับ '+QT[q].th+' ('+QT[q].en+')'+(q>=4?' ยอดเยี่ยมมาก':''));
}
function enhGet(slot){return slot==='w'?(s.weapon>0?{n:wName(s.weapon),e:s.wEnh|0}:null):slot==='a'?(s.armor>0?{n:ARMORS[s.armor].n,e:s.aEnh|0}:null):(s.acc[slot]?{n:ACC[slot].n,e:s.acc[slot].e|0}:null)}
function enhance(slot){var _b=dqSnap();enhance0(slot);if(dqSnap()!==_b)dqAdd('craft')}
function enhance0(slot){
 if(s.erst||s.pend)return;
 var it=enhGet(slot);if(!it||it.e>=ENH_MAX)return;
 var n=it.e,c=enhCost(n);if(s.gold<c)return;s.gold-=c;
 var r=enhRate(n),x=Math.random(),res,to=n;
 if(x<r.ok){res='ok';to=n+1}else if(x<r.ok+r.down){res='down';to=Math.max(0,n-1)}else if(x<r.ok+r.down+r.brk){res='break';to=0}else{res='same';to=n}
 if(res==='ok'||res==='down'){if(slot==='w')s.wEnh=to;else if(slot==='a')s.aEnh=to;else s.acc[slot].e=to}
 if(res==='break'){
  if(slot==='w'){s.weapon=0;s.wq=0;s.wEnh=0;s.wSk=0;s.wCards=[]}else if(slot==='a'){s.armor=0;s.aq=0;s.aEnh=0}else s.acc[slot]=null}
 s.erst={n:it.n,from:n,to:to,res:res};recalc();
 say('ตีบวก '+it.n+' +'+n+' → '+(res==='break'?'แตก!':'+'+to));
}

function pendName(p){return p.k==='w'?wName(p.i):p.k==='a'?ARMORS[p.i].n:ACC[p.i].n+' Lv'+LV_REQ[p.g|0]}
function pendDesc(p){var m=QT[p.t].m;return (p.by?'<span style="color:#e8c26a">🔒 คราฟโดย '+esc(p.by)+' (ผูกกับผู้คราฟ)</span><br>':'')+(p.sk?'<b style="color:#7ad7ff">มีรู '+p.sk+' ช่อง '+skTxt(p.sk)+'</b><br>':'')+(p.k==='w'?'พลังโจมตี +'+Math.round(WEAPONS[p.i].p*m):p.k==='a'?'ป้องกัน +'+Math.round(ARMORS[p.i].d*m):ACC[p.i].d(m*ACCG[p.g|0]))}

 if(eq){
  var cn=p.k==='a'?[]:cardNew(p);if(p.k==='w'){s.weapon=p.i;s.wq=p.t;s.wSk=p.sk|0;s.wCards=cn;s.wBy=p.by||''}else if(p.k==='a'){s.armor=p.i;s.aq=p.t}else s.acc[p.i]={t:p.t,g:p.g|0,e:(s.acc[p.i]&&s.acc[p.i].e)|0,sk:p.sk|0,cd:cn,by:p.by||''}; // เปลี่ยนชิ้นใหม่ แต้มตีบวกไม่หาย

 }else{var g=pendPrice(p);s.gold+=g;say('ขาย '+pendName(p)+' ได้ '+g+' ทอง')}
 s.pend=null}

 var pool=[],tot=0,W={1:55,2:35,3:10};
 Object.keys(COS).forEach(function(sl){COS[sl].forEach(function(it){
  if(it.r>0&&s.owned[sl].indexOf(it.id)<0){pool.push({sl:sl,it:it,w:W[it.r]});tot+=W[it.r]}})});
 if(!pool.length){s.gold+=400;s.boxIt=null;s.boxMsg='ของแต่งตัวครบทุกชิ้นแล้ว แปลงเป็นทอง +400';say('เปิดกล่อง ได้ทอง +400');return}
 var r=Math.random()*tot,ch=pool[0];
 for(var i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){ch=pool[i];break}}
 s.owned[ch.sl].push(ch.it.id);s.look[ch.sl]=ch.it.id;
 s.boxMsg='ได้ '+ch.it.n+' ('+RAR_N[ch.it.r]+') สวมใส่ให้แล้ว';s.boxIt={sl:ch.sl,id:ch.it.id};
 say('เปิดกล่อง ได้ '+ch.it.n);
}

var ACC_KEY='shuk-accounts-v1',SESS_KEY='shuk-session-v1',memAcc=null,memSess=null,curUser=null,authBusy=false;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function accLoad(){var r=lsGet(ACC_KEY);if(r){try{var o=JSON.parse(r);if(o&&o.users)return o}catch(e){}}return memAcc||{users:{}}}
function accSave(o){memAcc=o;lsSet(ACC_KEY,JSON.stringify(o))}
function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function rndHex(n){
 var a=new Uint8Array(n),i;
 if(typeof crypto!=='undefined'&&crypto.getRandomValues)crypto.getRandomValues(a);
 else for(i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);
 return toHex(a);
}
function fnv(str){var h=2166136261,i;for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function hasSubtle(){try{return typeof crypto!=='undefined'&&!!crypto.subtle&&typeof TextEncoder!=='undefined'}catch(e){return false}}
function hashPw(alg,salt,pw){
 if(alg==='p'){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
   return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:60000,hash:'SHA-256'},k,256)}).then(toHex);
 }
 return Promise.resolve(fnv(salt+':'+pw)+fnv(pw+':'+salt));
}

function checkCred(c,strict){
 if(!c.id||!c.pw){setMsg('กรอกไอดีและรหัสผ่านก่อน');return false}
 if(strict){
  if(!/^[A-Za-z0-9_]{3,16}$/.test(c.id)){setMsg('ไอดีใช้ได้เฉพาะ A–Z ตัวเลข และ _ ยาว 3–16 ตัว');return false}
  if(c.pw.length<6||c.pw.length>32){setMsg('รหัสผ่านต้องยาว 6–32 ตัวอักษร');return false}
 }
 return true;
}
function doRegister(){
 if(authBusy)return;
 var c=readCred();if(!checkCred(c,true))return;
 var acc=accLoad(),key=c.id.toLowerCase();
 if(acc.users[key]){setMsg('ไอดีนี้ถูกใช้แล้ว ลองไอดีอื่น');return}
 setBusy(true);setMsg('กำลังสร้างบัญชี...',true);
 var alg=hasSubtle()?'p':'f',salt=rndHex(16);
 hashPw(alg,salt,c.pw).then(function(h){
  var a2=accLoad();
  if(a2.users[key]){setMsg('ไอดีนี้ถูกใช้แล้ว ลองไอดีอื่น');return}
  var first=Object.keys(a2.users).length===0,old=first?lsGet(LEGACY_SAVE):null;
  a2.users[key]={id:c.id,alg:alg,salt:salt,hash:h,created:Date.now()};accSave(a2);
  if(old)lsSet('shuk-save-v1:'+key,old);
  document.getElementById('pwd').value='';
  startGame(key,!!old);
 }).catch(function(){setMsg('สมัครไม่สำเร็จ ลองใหม่อีกครั้ง')}).then(function(){setBusy(false)});
}

 if(!u){setMsg('ไม่พบไอดีนี้ ถ้ายังไม่มีบัญชีให้กด "สมัครไอดี"');return}
 if(u.alg==='p'&&!hasSubtle()){setMsg('เบราว์เซอร์นี้ตรวจรหัสผ่านไม่ได้ ลองเปิดด้วยเบราว์เซอร์อื่น');return}
 setBusy(true);setMsg('กำลังตรวจสอบ...',true);
 hashPw(u.alg,u.salt,c.pw).then(function(h){
  if(h!==u.hash){setMsg('รหัสผ่านไม่ถูกต้อง');return}
  document.getElementById('pwd').value='';
  startGame(key,false);
 }).catch(function(){setMsg('เข้าเกมส์ไม่สำเร็จ ลองใหม่อีกครั้ง')}).then(function(){setBusy(false)});
